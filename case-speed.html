<body>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fashion retail case study · Brandita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@600;800&display=swap">
<style>
html,body{margin:0;background:#F1ECE4}
/* Brandita case engine — one stylesheet for every generated case page.
   The client's palette arrives as --bg / --fg / --ac / --ai on .cx; everything
   else derives from it, so a light client and a dark client both work. */
.cx{--mute:color-mix(in srgb,var(--fg) 62%,transparent);--rule:color-mix(in srgb,var(--fg) 14%,transparent);--soft:color-mix(in srgb,var(--fg) 6%,transparent);
  --ease:cubic-bezier(.23,1,.32,1);--gut:clamp(18px,4vw,64px);--maxw:1320px;--red:#DE0000;
  background:var(--bg);color:var(--fg);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
.cx *{box-sizing:border-box}
.cx h1,.cx h2,.cx h3,.cx h4,.cx p,.cx dl,.cx dd,.cx figure{margin:0}
.cx h1,.cx h2,.cx h3{font-weight:800;text-wrap:balance}
.cx button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.cx a{color:inherit}
.cx em{font-style:normal;color:var(--ac)}
.cx .tnum{font-variant-numeric:tabular-nums}
.cx :focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:8px}
.cx-wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gut)}
.cx-k{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.cx-k::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac)}
.tag{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.tag.real{border-color:var(--ac);color:var(--fg)}
.tag.smp{border-style:dashed}
.cx-src{font-size:12.5px;color:var(--mute);margin-top:14px}

/* reveal: elements rise in once, on the compositor */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform 1.1s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}

/* ── top chrome: glass logo, back to the stories, book a call ── */
.cx-nav{position:fixed;z-index:50;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);padding-inline:var(--gut);display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;transition:transform .55s var(--ease)}
.cx-nav>*{pointer-events:auto}
.cx-nav.hide{transform:translateY(calc(-100% - 24px - env(safe-area-inset-top,0px)))}
.gl{position:relative;isolation:isolate;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(58,56,62,.5),rgba(16,15,18,.4));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.07);backdrop-filter:blur(18px) saturate(1.9);-webkit-backdrop-filter:blur(18px) saturate(1.9)}
.cx-nav .lg{display:flex;align-items:center;gap:12px;padding:9px 16px;text-decoration:none;color:#F7F2F8;font-size:13px;font-weight:700}
.cx-nav .lg img{height:22px;width:auto;display:block}
.cx-nav .lg span{opacity:.7;border-left:1px solid rgba(255,255,255,.2);padding-left:12px}
.cx-nav .bk{display:inline-flex;align-items:center;gap:10px;padding:5px 5px 5px 18px;text-decoration:none;color:#F7F2F8;font-size:13.5px;font-weight:700}
.cx-nav .bk i{width:33px;height:33px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;transition:transform .55s var(--ease)}
.cx-nav .bk svg{width:15px;height:15px}
@media (hover:hover) and (pointer:fine){.cx-nav .bk:hover i{transform:rotate(45deg)}}
.cx-nav .lg,.cx-nav .bk{white-space:nowrap}
@media (max-width:560px){.cx-nav .lg span{display:none}.cx-nav .bk{font-size:12.5px;gap:8px;padding:4px 4px 4px 14px}.cx-nav .bk i{width:30px;height:30px}}
.cx-prog{position:fixed;z-index:51;left:0;right:0;top:0;height:3px;background:transparent;pointer-events:none}
.cx-prog i{display:block;height:100%;background:var(--ac);transform-origin:0 50%;transform:scaleX(0)}
.cx-index{position:fixed;z-index:40;right:var(--gut);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;mix-blend-mode:normal}
.cx-index a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;font-size:11.5px;font-weight:800;color:var(--mute);padding:3px 0}
.cx-index a span{opacity:0;transform:translateX(6px);transition:opacity .3s ease,transform .4s var(--ease);white-space:nowrap}
.cx-index a i{width:26px;height:2px;border-radius:2px;background:var(--rule);transform:scaleX(.5);transform-origin:100% 50%;transition:transform .4s var(--ease),background-color .3s ease}
.cx-index a.on{color:var(--fg)}
.cx-index a.on i{transform:scaleX(1);background:var(--ac)}
@media (hover:hover) and (pointer:fine){.cx-index:hover a span{opacity:1;transform:none}}
@media (max-width:1100px){.cx-index{display:none}}

/* ── cover ── */
.cx-cover{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;padding-block:clamp(110px,16vh,160px) clamp(40px,7vh,80px)}
.cx-cover-bg{position:absolute;right:-.06em;top:50%;transform:translateY(-55%);font-size:clamp(220px,46vw,820px);font-weight:900;letter-spacing:-.045em;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--rule);white-space:nowrap;pointer-events:none;user-select:none}
.cx-cover .cx-wrap{position:relative;width:100%}
.cx-tags{display:flex;gap:8px;flex-wrap:wrap}
.cx-client{font-size:clamp(15px,1.4vw,19px);font-weight:700;color:var(--mute);margin-top:28px}
.cx-title{font-size:clamp(40px,7.4vw,124px);letter-spacing:-.045em;line-height:.92;max-width:15ch;margin-top:12px}
.cx-metric{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:clamp(28px,5vh,52px)}
.cx-metric b{font-size:clamp(64px,10vw,170px);font-weight:900;letter-spacing:-.045em;line-height:.8;color:var(--ac)}
.cx-metric span{font-size:14px;color:var(--mute);max-width:22ch}
.cx-proof{display:grid;grid-template-columns:repeat(3,minmax(0,max-content));gap:clamp(18px,3vw,56px);margin-top:clamp(28px,5vh,52px)}
.cx-proof div{border-top:2px solid var(--ac);padding-top:12px;max-width:22ch}
.cx-proof b{display:block;font-size:clamp(34px,4.4vw,72px);font-weight:900;letter-spacing:-.045em;line-height:.9}
.cx-proof span{display:block;font-size:13px;color:var(--mute);margin-top:8px}
@media (max-width:640px){.cx-proof{grid-template-columns:1fr 1fr}.cx-proof div:first-child{grid-column:1/-1}.cx-proof b{font-size:clamp(28px,8vw,40px);white-space:nowrap}}
.cx-scroll{margin-top:clamp(28px,5vh,56px);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:inline-flex;align-items:center;gap:10px}
.cx-scroll i{width:1px;height:34px;background:var(--rule);position:relative;overflow:hidden}
.cx-scroll i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ac);animation:cxdrip 1.8s var(--ease) infinite}
@keyframes cxdrip{to{top:100%}}

/* ── chapters ── */
.cx-ch{padding-block:clamp(80px,12vw,170px);border-top:1px solid var(--rule)}
.cx-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,40px);align-items:end;margin-bottom:clamp(36px,5vw,72px)}
.cx-n{font-size:clamp(70px,11vw,180px);font-weight:900;letter-spacing:-.045em;line-height:.78;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--fg) 30%,transparent)}
.cx-t{font-size:clamp(30px,4.4vw,72px);letter-spacing:-.04em;line-height:.98;margin-top:12px;max-width:20ch}
.cx-lede{font-size:clamp(17px,1.6vw,22px);color:var(--mute);max-width:56ch}
.cx-insight{margin-top:clamp(30px,4vw,56px);padding:clamp(20px,2.4vw,30px);border-radius:24px;background:var(--soft);border:1px solid var(--rule);display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.cx-insight b{font-size:clamp(40px,5.4vw,88px);font-weight:900;letter-spacing:-.045em;line-height:.85;color:var(--ac);white-space:nowrap}
.cx-insight p{font-size:clamp(16px,1.5vw,20px);font-weight:600;line-height:1.4}
.cx-insight small{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-top:6px}
@media (max-width:640px){.cx-insight{grid-template-columns:1fr}}

/* brief */
.cx-brief{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--rule)}
.cx-brief div{padding:18px 18px 0 0}
.cx-brief div+div{padding-inline-start:18px;border-inline-start:1px solid var(--rule)}
.cx-brief dt{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.cx-brief dd{font-size:clamp(15px,1.4vw,19px);font-weight:700;margin-top:8px;line-height:1.3}
.cx-sum{font-size:clamp(22px,2.6vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.15;max-width:28ch;margin-bottom:clamp(30px,4vw,56px)}
@media (max-width:900px){.cx-brief{grid-template-columns:1fr 1fr}.cx-brief div:nth-child(odd){border-inline-start:0;padding-inline-start:0}.cx-brief div{padding-bottom:16px}}

/* before: a wall of constraints, then the audit */
.cx-wall{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:clamp(36px,5vw,64px)}
.cx-wall span{position:relative;font-size:clamp(17px,2vw,28px);font-weight:800;letter-spacing:-.02em;padding:10px 20px;border-radius:999px;border:1px solid var(--rule);color:var(--fg)}
.cx-wall span::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;background:var(--ac);transform:scaleX(0);transform-origin:0 50%;transition:transform .9s var(--ease)}
.cx-wall.in span::after{transform:scaleX(1)}
.cx-wall.in span:nth-child(2)::after{transition-delay:.12s}.cx-wall.in span:nth-child(3)::after{transition-delay:.24s}.cx-wall.in span:nth-child(4)::after{transition-delay:.36s}.cx-wall.in span:nth-child(5)::after{transition-delay:.48s}.cx-wall.in span:nth-child(6)::after{transition-delay:.6s}
.cx-audit{list-style:none;margin:0;padding:0;counter-reset:a;columns:2;column-gap:clamp(24px,4vw,64px)}
.cx-audit li{counter-increment:a;break-inside:avoid;display:grid;grid-template-columns:44px 1fr;gap:10px;padding-block:16px;border-top:1px solid var(--rule);font-size:clamp(16px,1.5vw,20px);font-weight:700;line-height:1.35}
.cx-audit li::before{content:counter(a,decimal-leading-zero);font-size:12px;font-weight:800;color:var(--ac);padding-top:4px}
@media (max-width:760px){.cx-audit{columns:1}}
.cx-quote{font-size:clamp(24px,3.2vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1.15;max-width:26ch}
.cx-quote+.cx-lede{margin-top:22px}

/* the run: a pinned month-by-month film driven by scroll */
.run{position:relative;height:calc(var(--n) * 42svh + 100svh)}
.run-sticky{position:sticky;top:0;height:100svh;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,4vw,70px);align-items:center;padding-block:clamp(70px,10vh,110px) 30px}
.run-mo{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.run-big{display:block;font-size:clamp(52px,7.4vw,124px);font-weight:900;letter-spacing:-.045em;line-height:.88;margin-top:10px;white-space:nowrap}
.run-l small{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.run-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-top:26px}
.run-stats div{border-top:1px solid var(--rule);padding-top:8px}
.run-stats dt{font-size:12px;font-weight:600;color:var(--mute)}
.run-stats dd{font-size:clamp(18px,1.9vw,26px);font-weight:800;letter-spacing:-.03em}
.run-stats dd.hot{color:var(--ac)}
.run-note{margin-top:22px;min-height:3.2em;font-size:15px;font-weight:700;line-height:1.4;color:var(--fg)}
.run-note b{color:var(--ac)}
.run-chart{position:relative;height:min(58svh,520px);display:flex;align-items:flex-end;gap:clamp(4px,.8vw,12px);border-bottom:1px solid var(--rule);padding-bottom:28px}
.run-col{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;gap:3px}
.run-col i{flex:1;height:100%;border-radius:6px 6px 2px 2px;transform-origin:50% 100%;transform:scaleY(0);transition:transform .5s var(--ease),background-color .3s ease}
.run-col .sp{background:var(--rule)}
.run-col .sa{background:color-mix(in srgb,var(--fg) 55%,transparent)}
.run-col.now .sa{background:var(--ac)}
.run-col span{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--mute)}
.run-col.now span{color:var(--fg)}
.run-key{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:34px}
.run-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:900px){
  .run{height:calc(var(--n) * 34svh + 100svh)}
  .run-sticky{grid-template-columns:1fr;align-content:center;gap:22px;padding-block:80px 20px}
  .run-chart{height:30svh}
  .run-stats{margin-top:16px;gap:10px 16px}
  .run-note{min-height:2.8em;margin-top:12px;font-size:14px}
}

/* the work: levers that flip */
.cx-levers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lev{position:relative;min-height:250px;perspective:1200px}
.lev-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s var(--ease)}
.lev[aria-expanded="true"] .lev-in{transform:rotateY(180deg)}
.lev-f,.lev-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:start}
.lev-f{background:var(--soft);border:1px solid var(--rule)}
.lev-b{background:var(--ac);color:var(--ai);transform:rotateY(180deg);justify-content:center}
.lev-b p{font-size:clamp(16px,1.4vw,19px);font-weight:700;line-height:1.4}
.lev .no{font-size:46px;font-weight:900;letter-spacing:-.045em;line-height:.85;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--fg) 35%,transparent)}
.lev h3{font-size:21px;letter-spacing:-.02em;margin-top:auto}
.lev .st{font-size:24px;font-weight:900;letter-spacing:-.03em}
.lev .won{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ac);border-radius:999px;padding:4px 10px}
.lev.miss .lev-f{border-style:dashed}
.lev.miss .won{border-color:var(--rule);color:var(--mute)}
.lev .tap{font-size:11.5px;color:var(--mute);font-weight:700}
@media (hover:hover) and (pointer:fine){.lev:hover .lev-in{transform:rotateY(180deg)}}
@media (max-width:900px){.cx-levers{grid-template-columns:1fr 1fr}.lev{min-height:220px}}
@media (max-width:540px){.cx-levers{grid-template-columns:1fr}}
.cx-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
.cx-steps li{list-style:none;border-radius:22px;border:1px solid var(--rule);padding:20px;background:var(--soft)}
.cx-steps b{display:block;font-size:19px;margin-top:8px}
.cx-steps span{font-size:14.5px;color:var(--mute)}
.cx-steps .no{font-size:12px;font-weight:800;color:var(--ac)}
@media (max-width:900px){.cx-steps{grid-template-columns:1fr 1fr}}
.cx-steps-wrap{padding:0;margin:0}

/* the creative: hooks as a reel of phones */
.reel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut)}
.reel::-webkit-scrollbar{display:none}
.ph{flex:0 0 clamp(210px,22vw,270px);aspect-ratio:9/16;border-radius:26px;overflow:hidden;position:relative;scroll-snap-align:start;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--ac) 55%,#000) 0%,#0e0c0b 70%);border:1px solid var(--rule);display:flex;flex-direction:column;padding:16px}
.ph.still{background:linear-gradient(180deg,#2a2826,#151413)}
.ph .bar{height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.ph .bar b{display:block;height:100%;width:100%;background:#fff;transform-origin:0 50%;animation:cxplay 6s linear infinite}
@keyframes cxplay{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ph .dir{margin-top:14px;align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.14)}
.ph .ar{font-family:"Cairo","Inter",sans-serif;direction:rtl;text-align:right;font-size:clamp(19px,1.8vw,23px);font-weight:800;line-height:1.5;margin-top:auto}
.ph .en{font-size:12px;opacity:.72;margin-top:8px;line-height:1.4}
.ph .meter{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.ph .meter span{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.ph .meter i{display:block;height:100%;background:var(--ac);transform-origin:0 50%;transform:scaleX(0);transition:transform 1.4s var(--ease)}
.reel.in .ph .meter i{transform:scaleX(var(--w))}
.ph .meter b{font-size:20px;font-weight:900;letter-spacing:-.03em}
.ph.still .meter i{background:#9a9592}
.ph .vis{font-size:11px;opacity:.6;margin-top:6px}

/* ── the evidence: a case file of interactive windows ── */
.ev-tabs{display:inline-flex;gap:4px;padding:5px;border-radius:999px;border:1px solid var(--rule);background:var(--soft);margin-bottom:22px;flex-wrap:wrap}
.ev-tabs button{padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;color:var(--mute);transition:color .3s ease,background-color .3s ease}
.ev-tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.ev-panel[hidden]{display:none}
.ev-panel{animation:cxpanel .6s var(--ease)}
@keyframes cxpanel{from{opacity:0;transform:translateY(18px) scale(.985)}}
.win{border-radius:20px;overflow:hidden;background:#fbfbfb;color:#1a1a1a;border:1px solid var(--rule);font-family:"Inter",system-ui,sans-serif}
.win-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;background:#ececec;border-bottom:1px solid #dcdcdc;font-size:12.5px;font-weight:700;color:#555}
.win-bar i{width:11px;height:11px;border-radius:50%;background:#cfcfcf}
.win-bar span{margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-body{padding:clamp(16px,2vw,26px)}
.win-src{font-size:12px;color:#6b6b6b;margin-top:16px}
/* store dashboard: an analytics admin. Flat (no shadows), Inter, the admin's neutral greys */
.sx{background:#f1f1f1;color:#303030;font-size:13px}
.sx-strip{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#e3e3e3;font-size:11.5px;font-weight:700;color:#5c5c5c}
.sx-app{display:flex;flex-direction:column}
.sx-top{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;background:#1a1a1a;color:#e3e3e3}
.sx-mk{width:30px;height:30px;border-radius:8px;background:#2e2e2e;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.sx-search{flex:1;max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:#303030;border:1px solid #3d3d3d;color:#b5b5b5;font-size:13px}
.sx-search svg{width:16px;height:16px}
.sx-search kbd{margin-left:auto;font:600 11px/1 "Inter",sans-serif;color:#9a9a9a;background:#3d3d3d;border-radius:5px;padding:4px 6px}
.sx-me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}
.sx-me i{font-style:normal;width:28px;height:28px;border-radius:8px;background:#36fba1;color:#0f3d2a;display:grid;place-items:center;font-size:11px;font-weight:800}
.sx-frame{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:640px}
.sx-nav{background:#ebebeb;padding:12px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid #e1e1e1}
.sx-nav span{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;color:#303030}
.sx-nav span.on{background:#fff;color:#1a1a1a}
.sx-nav svg{width:18px;height:18px;color:#4a4a4a}
.sx-main{padding:clamp(14px,2vw,24px);min-width:0}
.sx-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sx-h b{font-size:20px;font-weight:700;color:#1a1a1a;margin-right:6px}
.sx-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:#fff;border:1px solid #d4d4d4;font-size:12.5px;font-weight:600}
.sx-chip svg{width:14px;height:14px}
.sx-chip.ghost{background:transparent;border-color:transparent;color:#616161}
.sx-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:12px;background:#fff;border:1px solid #e3e3e3;overflow:hidden}
.sx-kpi{position:relative;padding:14px 16px 16px;border-right:1px solid #ebebeb;min-height:96px}
.sx-kpi:last-child{border-right:0}
.sx-kl{font-size:12.5px;font-weight:600;color:#303030;border-bottom:1px dotted #8a8a8a}
.sx-kpi b{display:block;font-size:clamp(18px,1.8vw,24px);font-weight:700;letter-spacing:-.01em;margin-top:8px;color:#1a1a1a;white-space:nowrap}
.sx-up{display:inline-flex;align-items:center;gap:2px;margin-top:4px;font-size:12px;font-weight:650;color:#0c5132;background:#cdfee1;border-radius:6px;padding:2px 6px}
.sx-up svg{width:12px;height:12px}
.sx-spark{position:absolute;right:14px;bottom:14px;width:38%;height:30px;overflow:visible}
.sx-spark path{fill:none;stroke:#4b95e5;stroke-width:1.6;vector-effect:non-scaling-stroke}
.sx-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px;font-size:12px;color:#616161;font-weight:600}
.sx-pick{position:relative}
.sx-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:#fff;border:1px solid #d4d4d4;font-size:12.5px;font-weight:600;color:#303030}
.sx-btn svg{width:14px;height:14px}
.sx-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:190px;padding:6px;border-radius:12px;background:#fff;border:1px solid #d4d4d4;display:flex;flex-direction:column}
.sx-menu[hidden]{display:none}
.sx-menu button{text-align:start;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:#303030}
.sx-menu button[aria-checked="true"]{background:#f1f1f1}
.sx-menu button:hover{background:#f6f6f6}
.sx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sx-card{background:#fff;border:1px solid #e3e3e3;border-radius:12px;padding:16px;min-width:0}
.sx-wide{grid-column:1/-1}
.sx-card header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sx-ct{font-size:13px;font-weight:650;color:#303030;border-bottom:1px dotted #8a8a8a}
.sx-seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:#f1f1f1}
.sx-seg button{padding:5px 9px;border-radius:6px;font-size:12px;font-weight:600;color:#616161}
.sx-seg button[aria-pressed="true"]{background:#fff;color:#1a1a1a;box-shadow:inset 0 0 0 1px #d4d4d4}
.sx-big{display:block;font-size:22px;font-weight:700;color:#1a1a1a;margin:10px 0 8px}
.sx-big.sm{font-size:18px}
.sx-chart{position:relative;height:230px;margin:6px 0 22px 52px;touch-action:pan-y}
.sx-chart.sm{height:150px}
.sx-chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sx-chart .gr line{stroke:#ebebeb;stroke-width:1;vector-effect:non-scaling-stroke}
.sx-chart .ln{fill:none;stroke:#4b95e5;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.sx-chart .ar{fill:rgba(75,149,229,.1)}
.sx-y{position:absolute;left:-52px;top:0;bottom:0;width:46px}
.sx-y span{position:absolute;right:0;transform:translateY(-50%);font-size:11px;color:#8a8a8a;white-space:nowrap}
.sx-x{position:absolute;left:0;right:0;bottom:-20px;height:14px}
.sx-x span{position:absolute;transform:translateX(-50%);font-size:11px;color:#8a8a8a}
.sx-cross{position:absolute;top:0;bottom:0;width:1px;background:#c9c9c9;opacity:0;pointer-events:none}
.sx-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:2.5px solid #4b95e5;opacity:0;pointer-events:none}
.sx-tip{position:absolute;top:-8px;transform:translate(-50%,-100%);z-index:3;background:#fff;border:1px solid #d4d4d4;border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease}
.sx-tip small{display:block;color:#616161;font-size:11px}
.sx-tip b{font-weight:700;color:#1a1a1a}
.sx-chart.hov .sx-cross,.sx-chart.hov .sx-dot,.sx-chart.hov .sx-tip{opacity:1}
.sx-tw{overflow-x:auto;margin-top:8px}
.sx-t{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
.sx-t th{padding:0;border-bottom:1px solid #e3e3e3;text-align:right;font-size:12px;color:#616161;font-weight:600}
.sx-t th button{width:100%;padding:9px 10px;text-align:inherit;display:flex;justify-content:flex-end;gap:4px}
.sx-t th:first-child,.sx-t td:first-child{text-align:left}
.sx-t th:first-child button{justify-content:flex-start}
.sx-t th button[aria-sort]::after{content:"↓"}
.sx-t th button[aria-sort="ascending"]::after{content:"↑"}
.sx-t td{padding:9px 10px;border-bottom:1px solid #f1f1f1;text-align:right;font-variant-numeric:tabular-nums}
.sx-t td.upc{color:#0c5132}
.sx-t td.dn{color:#8e1f0b}
.sx-t tbody tr:hover{background:#fafafa}
.sx-src{font-size:11.5px;color:#616161;margin-top:12px}
@media (max-width:860px){
  .sx-frame{grid-template-columns:1fr;min-height:0}
  .sx-nav{display:none}
  .sx-kpis{grid-template-columns:1fr 1fr}
  .sx-kpi:nth-child(2){border-right:0}
  .sx-kpi:nth-child(-n+2){border-bottom:1px solid #ebebeb}
  .sx-grid{grid-template-columns:1fr}
  .sx-me span{display:none}
  .sx-search kbd{display:none}
}
/* ad ledger */
.ld-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ld-scroll{overflow-x:auto;border:1px solid #e3e3e3;border-radius:14px;background:#fff}
.ld{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
.ld th{position:sticky;top:0;background:#f6f6f6;text-align:right;font-size:12px;font-weight:700;color:#555;padding:0;border-bottom:1px solid #e3e3e3;white-space:nowrap}
.ld th button{width:100%;padding:11px 12px;text-align:inherit;display:flex;justify-content:flex-end;gap:6px;align-items:center}
.ld th:first-child,.ld td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
.ld th:first-child button{justify-content:flex-start}
.ld th:first-child{background:#f6f6f6;z-index:2;border-right:1px solid #e3e3e3}
.ld td:first-child{border-right:1px solid #efefef}
.ld tfoot td:first-child{background:#f6f6f6}
.ld th button[aria-sort]::after{content:"↓";font-size:11px}
.ld th button[aria-sort="ascending"]::after{content:"↑"}
.ld td{padding:11px 12px;border-bottom:1px solid #efefef;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ld tbody tr{background:#fff;transition:background-color .2s ease}
.ld tbody tr:hover{background:#fafafa}
.ld td:first-child{font-weight:700;color:#1b5fc1}
.ld .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c9c9c9;margin-right:8px}
.ld .dot.on{background:#0a8a4a}
.ld tfoot td{background:#f6f6f6;font-weight:800;color:#111;border-bottom:0}
.ld .roas-hi{color:#0a8a4a;font-weight:800}
/* screenshot wall */
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,26px);padding-block:10px}
.cx .shot{display:block;width:100%;position:relative;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--rule);text-align:start;transform:rotate(var(--r,0deg));transition:transform .6s var(--ease)}
.shot .win-bar{padding:9px 12px;font-size:11.5px}
.shot img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#f3f3f3;padding:10px;transition:transform .9s var(--ease)}
.shot figcaption{padding:12px 14px;color:#333;font-size:12.5px;line-height:1.35}
.shot figcaption b{display:block;color:#111;font-size:13.5px}
.shot .hid{display:block;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#777}
@media (hover:hover) and (pointer:fine){.shot:hover{transform:rotate(0deg) translateY(-6px)}.shot:hover img{transform:scale(1.04)}}
@media (max-width:900px){.wall{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.wall{grid-template-columns:1fr}}
.cx-lb{position:fixed;inset:0;z-index:90;background:rgba(8,8,8,.94);display:grid;place-items:center;padding:20px}
.cx-lb[hidden]{display:none}
.cx-lb figure{max-width:min(1500px,100%);max-height:100%;overflow:auto;border-radius:12px}
.cx-lb img{display:block;max-width:100%;height:auto;border-radius:12px;background:#fff;cursor:zoom-in;transition:transform .4s var(--ease)}
.cx-lb img.zoom{max-width:none;width:200%;cursor:zoom-out}
.cx-lb p{color:#fff;font-size:13.5px;text-align:center;margin-top:12px}
.cx-lb button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;width:46px;height:46px;border-radius:50%;background:#fff;color:#111;font-size:22px;font-weight:700}

/* evidence placed in its chapter */
.srcs{margin-top:clamp(34px,5vw,64px)}
.srcs-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:clamp(14px,2vw,26px);margin-top:16px}
.srcs-row:has(> :only-child){grid-template-columns:minmax(0,560px)}
.cx .src{min-width:0;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--rule);text-align:start;transform:rotate(var(--r,0deg));transition:transform .6s var(--ease)}
.src .win-bar{padding:9px 12px;font-size:11.5px}
.src img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#f3f3f3;padding:8px}
.src .cap{padding:10px 14px;font-size:12.5px;color:#444}
@media (hover:hover) and (pointer:fine){.cx .src:hover{transform:rotate(0deg) translateY(-6px)}}
/* a real ad, in a phone */
.feed{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;margin-top:clamp(40px,6vw,80px)}
.feed-l{position:relative;display:grid;place-items:center;padding:clamp(20px,4vw,48px)}
.feed-l::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 55%,transparent),transparent);filter:blur(10px)}
.cx .phone{position:relative;width:min(420px,84vw);border-radius:20px;background:#fff;border:1px solid #e3e3e3;overflow:hidden;transform:rotate(-3deg);transition:transform .7s var(--ease);text-align:start}
.phone::after{content:"Like        Comment        Share";display:block;padding:12px 16px;border-top:1px solid #ececec;font:700 12.5px/1 "Inter",sans-serif;color:#7a7a7a;white-space:pre}
.phone .notch{display:none}
.phone img{display:block;width:100%;height:auto;background:#fff}
@media (hover:hover) and (pointer:fine){.cx .phone:hover{transform:rotate(0deg) scale(1.02)}}
.feed-cap{font-size:13px;color:var(--mute);margin-top:8px}
.feed-en{font-size:clamp(18px,1.9vw,26px);font-weight:700;line-height:1.4;letter-spacing:-.01em;margin-top:16px;max-width:42ch}
.feed-en i{font-size:13px;font-weight:600;color:var(--mute)}
.feed-n{margin-top:16px;padding:14px 16px;border-radius:16px;border:1px solid var(--rule);background:var(--soft);font-size:14.5px;max-width:52ch}
.feed-n b{color:var(--ac)}
@media (max-width:760px){.feed{grid-template-columns:1fr;justify-items:center}.feed-t{justify-self:stretch}}
/* rebuilt / original */
.win-tg{margin-left:auto;display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:#dedede}
.win-tg button{padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:700;color:#555}
.win-tg button[aria-pressed="true"]{background:#fff;color:#111}
.win-orig{padding:clamp(12px,1.6vw,20px)}
.cx .wo{display:block;width:100%}
.wo img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid #e3e3e3}
.reel.drag{cursor:grabbing;scroll-snap-type:none}
/* the cursor */
html.cx-curon,html.cx-curon *{cursor:none!important}
.cx-cur{position:fixed;left:0;top:0;z-index:99;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--red,#DE0000);pointer-events:none;opacity:0;display:grid;place-items:center;transition:opacity .25s ease;will-change:transform}
.cx-cur span{font:800 11px/1 "Inter",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:0;transition:opacity .2s ease}

/* ── the result ── */
.cx-ba{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:26px;overflow:hidden}
.cx-ba>div{background:var(--bg);padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:8px;min-height:220px}
.cx-ba .k{font-size:13px;font-weight:700;color:var(--mute)}
.cx-ba .from{font-size:14.5px;color:var(--mute)}
.cx-ba .from s{text-decoration-color:var(--ac);text-decoration-thickness:2px}
.cx-ba .to{font-size:clamp(38px,4.6vw,72px);font-weight:900;letter-spacing:-.045em;line-height:.95;margin-top:auto}
.cx-ba .to.hot{color:var(--ac)}
.cx-ba .when{font-size:12px;color:var(--mute)}
@media (max-width:900px){.cx-ba{grid-template-columns:1fr}}
.cx-q{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(24px,5vw,80px);align-items:end;margin-top:clamp(40px,6vw,80px)}
.qrow+.qrow{margin-top:18px}
.qrow .top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;flex-wrap:wrap}
.qrow .tr{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.qrow .tr i{display:block;height:12px;border-radius:6px;background:var(--fg);transform-origin:0 50%;transform:scaleX(0);transition:transform 1.3s var(--ease)}
.qrow .tr i.p{background:var(--ac);transition-delay:.15s}
.in .qrow .tr i{transform:scaleX(var(--w))}
.ring{position:relative;width:min(260px,70vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p) * 1turn),var(--rule) 0);display:grid;place-items:center;margin-inline:auto}
.ring::before{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font-size:clamp(46px,6vw,84px);font-weight:900;letter-spacing:-.045em;line-height:.9;text-align:center}
.ring small{display:block;font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:0;margin-top:6px}
@media (max-width:760px){.cx-q{grid-template-columns:1fr}}
.cx-tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:clamp(40px,6vw,80px);border-top:1px solid var(--rule);padding-top:22px}
.cx-tot b{display:block;font-size:clamp(24px,2.8vw,40px);font-weight:900;letter-spacing:-.04em;line-height:1}
.cx-tot span{font-size:12.5px;color:var(--mute);margin-top:8px;display:block}
@media (max-width:760px){.cx-tot{grid-template-columns:1fr 1fr}}
.cx-cmp{display:flex;flex-direction:column;gap:24px;max-width:780px}
.cx-cmp .nm{font-size:16px;font-weight:800}
.cx-cmp .r{display:grid;grid-template-columns:62px 1fr 80px;gap:14px;align-items:center;font-size:13px;color:var(--mute);margin-top:10px}
.cx-cmp .tr{height:16px;border-radius:8px;background:var(--rule);overflow:hidden}
.cx-cmp .tr i{display:block;height:100%;border-radius:8px;background:color-mix(in srgb,var(--fg) 50%,transparent);transform-origin:0 50%;transform:scaleX(0);transition:transform 1.2s var(--ease)}
.cx-cmp .r.af .tr i{background:var(--ac);transition-delay:.2s}
.cx-cmp.in .tr i{transform:scaleX(var(--w))}
.cx-cmp .r b{color:var(--fg);text-align:end;font-size:17px}
.cx-big{font-size:clamp(70px,12vw,200px);font-weight:900;letter-spacing:-.045em;line-height:.82;color:var(--ac);margin-bottom:10px}

/* misses */
.cx-miss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cx-miss article{border:1.5px dashed var(--rule);border-radius:24px;padding:24px}
.cx-miss b{display:block;font-size:19px;letter-spacing:-.015em;line-height:1.25;margin-top:10px}
.cx-miss p{font-size:14.5px;color:var(--mute);margin-top:8px}
@media (max-width:900px){.cx-miss{grid-template-columns:1fr}}
.cx-miss.one{grid-template-columns:1fr;max-width:760px}
.cx-miss.one b{font-size:clamp(22px,2.6vw,34px)}

/* ── the next case ── */
.cx .cx-nc{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 30px;align-items:end;width:100%;margin-block:clamp(60px,8vw,110px) 0;padding:clamp(26px,3.4vw,48px);border-radius:32px;
  background:var(--nb);color:var(--nf);text-decoration:none;text-align:start;overflow:hidden;transition:transform .6s var(--ease)}
.cx-nc .cx-k{grid-column:1/-1;color:color-mix(in srgb,var(--nf) 70%,transparent)}
.cx-nc .cx-k::before{background:var(--na)}
.nc-c{grid-column:1/-1;font-size:14px;font-weight:700;opacity:.75}
.nc-t{font-size:clamp(26px,3.6vw,56px);font-weight:900;letter-spacing:-.04em;line-height:1;max-width:20ch}
.nc-m{font-size:clamp(46px,6vw,104px);font-weight:900;letter-spacing:-.045em;line-height:.82;color:var(--na)}
.nc-go{grid-column:1/-1;justify-self:start;margin-top:10px;display:inline-flex;padding:12px 20px;border-radius:999px;background:var(--nf);color:var(--nb);font-size:14.5px;font-weight:800;transition:transform .5s var(--ease)}
@media (hover:hover) and (pointer:fine){.cx .cx-nc:hover{transform:translateY(-6px)}.cx-nc:hover .nc-go{transform:translateX(8px)}}
.cx .cx-nc:active{transform:scale(.985)}
@media (max-width:640px){.cx .cx-nc{grid-template-columns:1fr}}

/* ── end ── */
.cx-end{padding-block:clamp(90px,12vw,170px) clamp(60px,8vw,110px);border-top:1px solid var(--rule)}
.cx-end h2{font-size:clamp(56px,11vw,190px);letter-spacing:-.045em;line-height:.86;font-weight:900}
.cx-end .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:end;margin-top:clamp(30px,4vw,60px)}

</style>
<div id="case"></div>
<script>
/* Brandita case engine.
   render(caseFile, root, opts) reads a case file, works out what it can say,
   and composes a story from the chapters its data supports. It never adds a
   figure the file does not hold: derived numbers (multiples, ratios, margins)
   are computed from the file and labelled "computed from the case file". */
(function (global) {
  "use strict";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const n0 = v => Math.round(v).toLocaleString("en-US");
  const pad = n => String(n).padStart(2, "0");
  const money = (v, cur) => (cur || "EGP") + " " + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e4 ? Math.round(v / 1e3) + "K" : n0(v));
  const x1 = v => (Math.round(v * 10) / 10).toFixed(1) + "×";
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  const CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';

  /* ══ read: what the case file can support, and what follows from it ══ */
  function read(c) {
    const R = {};
    const s = c.series;
    if (s && s.rows && s.rows.length > 2) {
      const rows = s.rows, first = rows[0];
      const argmax = k => rows.reduce((b, r, i) => (r[k] > rows[b][k] ? i : b), 0);
      const peakI = argmax("sales"), spendI = argmax("spend");
      const mom = rows.map((r, i) => (i ? (r.orders / rows[i - 1].orders - 1) * 100 : 0));
      let dipI = -1; // the deepest fall, leaving out the sheet's last month (it may be partial)
      mom.forEach((m, i) => { if (i > 0 && i < rows.length - 1 && m < 0 && (dipI < 0 || m < mom[dipI])) dipI = i; });
      const roas = rows.map(r => r.roas);
      R.series = { peakI, spendI, dipI, mom, spendX: rows[spendI].spend / first.spend, salesX: rows[peakI].sales / first.sales,
        roasMin: Math.min(...roas), roasMax: Math.max(...roas), cppPeak: (rows[peakI].cpp / first.cpp - 1) * 100 };
    }
    if (c.hooks && c.hooks.rows) {
      const rows = c.hooks.rows, still = rows.filter(r => r.static), moving = rows.filter(r => !r.static);
      const avg = a => a.reduce((t, r) => t + r.rate, 0) / a.length;
      if (still.length && moving.length) R.hooks = { moving: avg(moving), still: avg(still), ratio: avg(moving) / avg(still) };
    }
    if (c.levers) R.levers = { won: c.levers.filter(l => l.status === "won").length, miss: c.levers.filter(l => l.status === "miss").length };
    if (c.quarters && c.quarters.length > 1) {
      const q = c.quarters, m = q.map(x => (x.profit / x.sales) * 100);
      R.quarters = { growth: q[q.length - 1].sales / q[0].sales, margins: m, flat: Math.max(...m) - Math.min(...m) < 1 };
    }
    return R;
  }

  /* ══ plan: chapters in story order, only where the file has the material ══ */
  function plan(c, R) {
    const ch = [["brief", "The brief"]];
    if (c.before || c.leak) ch.push(["before", "Before"]);
    if (R.series) ch.push(["run", "The run"]);
    if (c.levers || c.steps) ch.push(["work", "The work"]);
    if (R.hooks) ch.push(["creative", "The creative"]);
    if (c.store || c.adAccount || (c.evidence && c.evidence.length)) ch.push(["evidence", "The evidence"]);
    if (c.outcomes || c.quarters || c.compare || c.totals) ch.push(["result", "The result"]);
    if (c.misses || c.miss) ch.push(["miss", "What did not work"]);
    return ch;
  }

  // the cover's proof points: computed from the series when there is one, else the headline metric
  function proof(c, R) {
    const S = R.series, s = c.series;
    if (!S) return [[c.metric.value, c.metric.label]];
    return [[x1(S.spendX), `monthly ad spend, ${s.months[0]} to ${s.months[S.spendI]}`], [x1(S.salesX), `monthly sales, ${s.months[0]} to ${s.months[S.peakI]}`],
      [`${S.roasMin.toFixed(2)}–${S.roasMax.toFixed(2)}×`, `ROAS, every month of ${s.year}`]];
  }
  const head = (i, kicker, title) => `<header class="cx-h rv"><span class="cx-n" aria-hidden="true">${pad(i)}</span><div><span class="cx-k">${esc(kicker)}</span><h2 class="cx-t">${title}</h2></div></header>`;
  const accent = (text, word) => { const t = esc(text), w = esc(word); return w && t.includes(w) ? t.replace(w, `<em>${w}</em>`) : t; };

  /* ══ chapters ══ */
  const B = {
    cover(c, R) {
      return `<header class="cx-cover" id="top">
        <div class="cx-cover-bg" aria-hidden="true">${esc(c.metric.value)}</div>
        <div class="cx-wrap">
          <div class="cx-tags rv">${c.real ? '<span class="tag real">Real client</span>' : '<span class="tag smp">Sample file</span>'}<span class="tag">${esc(c.line)}</span><span class="tag">${esc(c.sector)}</span></div>
          <p class="cx-client rv d1">${esc(c.fullName || c.client)}${c.period ? " · " + esc(c.period) : ""}</p>
          <h1 class="cx-title rv d1">${accent(c.headline, c.metric.value)}</h1>
          <div class="cx-proof rv d2">${proof(c, R).map(([v, l]) => `<div><b class="tnum" data-count="${esc(v)}">${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>
          ${c.real ? "" : '<p class="cx-src rv d3">Sample file. The client and every figure are placeholders that show the format a real case follows.</p>'}
        </div></header>`;
    },
    brief(c, R, i) {
      const cells = c.real
        ? [["Client", c.fullName || c.client], ["Industry", c.sector + (c.market ? ", " + c.market : "")], ["Services", (c.services || [c.line]).join(", ")], ["Period", c.period], ["Result", c.metric.value]]
        : [["Sector", c.sector], ["Service line", c.line], ["Result", c.metric.value], ["Measured as", c.metric.label], ["Status", "Sample, placeholder figures"]];
      return `<section class="cx-ch" id="brief"><div class="cx-wrap">${head(i, "The brief", c.real ? "One brand, one account, <em>one number.</em>" : "The format, with <em>sample</em> figures.")}
        ${c.summary ? `<p class="cx-sum rv">${esc(c.summary)}</p>` : ""}
        <dl class="cx-brief rv">${cells.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></div></section>`;
    },
    before(c, R, i) {
      if (c.before) return `<section class="cx-ch" id="before"><div class="cx-wrap">${head(i, "Before", accent(c.before.title, "ads."))}
        <div class="cx-wall rv">${c.before.constraints.map(t => `<span>${esc(t)}</span>`).join("")}</div>
        <span class="cx-k rv">What the audit found</span>
        <ol class="cx-audit rv" style="margin-top:18px">${c.before.audit.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div></section>`;
      return `<section class="cx-ch" id="before"><div class="cx-wrap">${head(i, "The leak", "Where the orders were <em>going.</em>")}
        <p class="cx-quote rv">${esc(c.leak)}</p><p class="cx-lede rv">${esc(c.sub || "")}</p></div></section>`;
    },
    run(c, R, i) {
      const s = c.series, rows = s.rows, mx = Math.max(...rows.map(r => r.sales)), S = R.series;
      return `<section class="cx-ch" id="run"><div class="cx-wrap">${head(i, "The run", `Spend up ${x1(S.spendX)}. Return held <em>the whole way.</em>`)}
        <p class="cx-lede rv">Scroll through the year, month by month, from ${esc(s.source)}.</p></div>
        <div class="run" style="--n:${rows.length}"><div class="run-sticky cx-wrap">
          <div class="run-l"><span class="run-mo" data-r="mo"></span><b class="run-big tnum" data-r="big"></b><small>sales that month</small>
            <dl class="run-stats"><div><dt>Ad spend</dt><dd class="tnum" data-r="spend"></dd></div><div><dt>ROAS</dt><dd class="tnum hot" data-r="roas"></dd></div>
              <div><dt>Orders</dt><dd class="tnum" data-r="orders"></dd></div><div><dt>Cost per purchase</dt><dd class="tnum" data-r="cpp"></dd></div></dl>
            <p class="run-note" data-r="note"></p></div>
          <div><div class="run-chart" role="img" aria-label="Monthly ad spend and sales, ${esc(s.months[0])} to ${esc(s.months[s.months.length - 1])} ${esc(s.year)}">
            ${rows.map((r, k) => `<div class="run-col" data-k="${k}"><i class="sp" style="--h:${(r.spend / mx).toFixed(4)}"></i><i class="sa" style="--h:${(r.sales / mx).toFixed(4)}"></i><span>${esc(s.months[k])}</span></div>`).join("")}</div>
            <div class="run-key"><span><i style="background:var(--rule)"></i>Ad spend</span><span><i style="background:var(--ac)"></i>Sales</span></div></div>
        </div></div>
        <div class="cx-wrap"><div class="cx-insight rv"><b class="tnum">${x1(S.salesX)}</b><p>${esc(s.monthsLong[S.peakI])} sales against ${esc(s.monthsLong[0])}, while ROAS stayed between ${S.roasMin.toFixed(2)}× and ${S.roasMax.toFixed(2)}× every month.<small>Computed from the case file.</small></p></div>${srcCards(c, "run", "The sheet these months come from")}</div></section>`;
    },
    work(c, R, i) {
      if (c.levers) return `<section class="cx-ch" id="work"><div class="cx-wrap">${head(i, "The work", `${c.levers.length} levers. Every one <em>tested.</em>`)}
        <p class="cx-lede rv" style="margin-bottom:28px">${R.levers.won} won, ${R.levers.miss} did not. Tap a card for what happened.</p>
        <div class="cx-levers">${c.levers.map((l, k) => `<button data-cursor="Flip" class="lev rv ${l.status === "miss" ? "miss" : ""}" type="button" aria-expanded="false" aria-label="${esc(l.title)}: ${esc(l.stat)}">
          <span class="lev-in"><span class="lev-f"><span class="no" aria-hidden="true">${pad(k + 1)}</span>${l.status ? `<span class="won">${l.status === "won" ? "Worked" : "Did not work"}</span>` : ""}<h3>${esc(l.title)}</h3><span class="st">${esc(l.stat)}</span><span class="tap" aria-hidden="true">Tap to read</span></span>
          <span class="lev-b"><p>${esc(l.detail)}</p></span></span></button>`).join("")}</div></div></section>`;
      return `<section class="cx-ch" id="work"><div class="cx-wrap">${head(i, "The work", "Four stages, each with a <em>document.</em>")}
        <ol class="cx-steps cx-steps-wrap">${c.steps.map(([t, d], k) => `<li class="rv d${k % 4}"><span class="no">${pad(k + 1)}</span><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join("")}</ol></div></section>`;
    },
    creative(c, R, i) {
      const H = c.hooks, top = Math.max(...H.rows.map(r => r.rate));
      return `<section class="cx-ch" id="creative"><div class="cx-wrap">${head(i, "The creative", "Stories pulled people in. Hard selling <em>did not.</em>")}
        <div class="cx-insight rv" style="margin:0 0 30px"><b class="tnum">${Math.round(R.hooks.ratio)}×</b><p>more viewers held by story and curiosity videos (${R.hooks.moving.toFixed(1)}% average hook rate) than by hard-selling statics (${R.hooks.still.toFixed(2)}%).<small>Computed from the case file. ${esc(H.note)}</small></p></div>
        <div class="reel" data-cursor="Drag">${H.rows.map(r => `<article class="ph ${r.static ? "still" : ""}"><div class="bar"><b></b></div><span class="dir">${esc(r.direction)}</span>
          <p class="ar" lang="ar" dir="rtl">${esc(r.text)}</p><p class="en">${esc(r.en)} <i>(translated)</i></p><p class="vis">${esc(r.visual)}</p>
          <div class="meter"><span><i style="--w:${Math.max(.01, r.rate / top).toFixed(3)}"></i></span><b class="tnum">${r.rate.toFixed(2)}%</b></div></article>`).join("")}</div>
        <p class="cx-src">Executions are illustrated from the real hooks; the hook rates are measured.</p>${feed(c)}${srcCards(c, "creative", "How the creative was made")}</div></section>`;
    },
    evidence(c, R, i) {
      const tabs = [];
      if (c.store && c.series) tabs.push(["store", "Store dashboard"]);
      if (c.adAccount) tabs.push(["ads", "Ad account"]);
      if (c.evidence && c.evidence.length) tabs.push(["shots", "Screenshots"]);
      return `<section class="cx-ch" id="evidence"><div class="cx-wrap">${head(i, "The evidence", "Opened straight from the <em>accounts.</em>")}
        <p class="cx-lede rv" style="margin-bottom:26px">The numbers above, in the places they came from. The dashboard and the ad ledger are rebuilt from the exports so you can explore them; the screenshots are the originals, with names and IDs hidden.</p>
        <div class="ev-tabs rv" role="tablist">${tabs.map(([k, t], j) => `<button type="button" role="tab" id="tab-${k}" aria-controls="ev-${k}" aria-selected="${j === 0}">${t}</button>`).join("")}</div>
        ${tabs.map(([k], j) => `<div class="ev-panel" role="tabpanel" id="ev-${k}" aria-labelledby="tab-${k}"${j ? " hidden" : ""}>${k === "store" ? store(c) : k === "ads" ? ledger(c) : wall(c)}</div>`).join("")}
      </div></section>`;
    },
    result(c, R, i) {
      let h = `<section class="cx-ch" id="result"><div class="cx-wrap">`;
      if (c.real) {
        h += head(i, "The result", "More sales every quarter, at the same <em>margin.</em>");
        if (c.outcomes) h += `<div class="cx-ba rv">${c.outcomes.map(o => `<div><span class="k">${esc(o.label)}</span><span class="from">From <s>${esc(o.from)}</s></span><span class="to tnum${o.hot ? " hot" : ""}">${esc(o.to)}</span><span class="when">${esc(o.when)}</span></div>`).join("")}</div>`;
        if (c.quarters) {
          const mx = Math.max(...c.quarters.map(q => q.sales)) * 1.02, m = R.quarters.margins, avg = m.reduce((a, b) => a + b, 0) / m.length;
          h += `<div class="cx-q rv"><div>${c.quarters.map((q, k) => `<div class="qrow"><div class="top"><span>${esc(q.q)} · ${money(q.sales)} sales</span><span class="tnum">${money(q.profit)} net profit · ${m[k].toFixed(1)}%</span></div>
            <div class="tr"><i style="--w:${(q.sales / mx).toFixed(3)}"></i><i class="p" style="--w:${(q.profit / mx).toFixed(3)}"></i></div></div>`).join("")}
            <p class="cx-src">${esc(c.quartersSource || "")}</p></div>
            <div><div class="ring" style="--p:${(avg / 100).toFixed(3)}"><b class="tnum">${Math.round(avg)}%<small>net profit / sales${R.quarters.flat ? ", every quarter" : ""}</small></b></div>
            <p class="cx-src" style="text-align:center">Sales grew ${x1(R.quarters.growth)} from ${esc(c.quarters[0].q)} to ${esc(c.quarters[c.quarters.length - 1].q)}. Computed from the case file.</p></div></div>`;
        }
        if (c.totals) h += `<div class="cx-tot rv">${c.totals.map(t => `<div><b class="tnum">${esc(t.value)}</b><span>${esc(t.label)}</span></div>`).join("")}</div><p class="cx-src">${esc(c.totalsSource || "")}</p>${srcCards(c, "result", "From Lazoomi's own books")}`;
      } else {
        h += head(i, "The result", "Same reporting source, before and <em>after.</em>");
        h += `<div class="cx-big tnum rv" data-count="${esc(c.metric.value)}">${esc(c.metric.value)}</div><p class="cx-lede rv" style="margin-bottom:36px">${esc(c.metric.label)}</p>
          <div class="cx-cmp rv">${c.compare.map(([nm, b, bl, a, al, mx]) => `<div><span class="nm">${esc(nm)}</span>
            <div class="r"><span>Before</span><span class="tr"><i style="--w:${(b / mx).toFixed(3)}"></i></span><b class="tnum">${esc(bl)}</b></div>
            <div class="r af"><span>After</span><span class="tr"><i style="--w:${(a / mx).toFixed(3)}"></i></span><b class="tnum">${esc(al)}</b></div></div>`).join("")}</div>
          <p class="cx-src">Sample file with placeholder figures. It shows the format a real case follows.</p>`;
      }
      return h + `</div></section>`;
    },
    miss(c, R, i) {
      const items = c.misses || [{ kind: "Did not work", title: c.miss, detail: "" }];
      return `<section class="cx-ch" id="miss"><div class="cx-wrap">${head(i, "What did not work", "We publish the <em>misses.</em>")}
        <div class="cx-miss ${items.length === 1 ? "one" : ""}">${items.map((m, k) => `<article class="rv d${k}"><span class="cx-k">${esc(m.kind)}</span><b>${esc(m.title)}</b>${m.detail ? `<p>${esc(m.detail)}</p>` : ""}</article>`).join("")}</div>
        <p class="cx-src">They are how the next test gets chosen.</p></div></section>`;
    }
  };

  /* the store dashboard: an analytics admin rebuilt from the store's export (KPIs)
     and the monthly operations sheet (charts, table). Layout follows the store
     platform's admin; no platform logo, and labelled as rebuilt. */
  const IC = {
    Home: "M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z", Orders: "M4 6h16v12H4zM4 13h4l1.5 2h5L16 13h4",
    Products: "M12.6 3.6 20 11a1.4 1.4 0 0 1 0 2l-7 7a1.4 1.4 0 0 1-2 0L3.6 12.6A2 2 0 0 1 3 11.2V5a2 2 0 0 1 2-2h6.2a2 2 0 0 1 1.4.6zM7.5 7.5h.01",
    Customers: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0", Content: "M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6",
    Analytics: "M5 20V11M10 20V5M15 20v-6M20 20V9", Marketing: "M4 10v4h3l6 4V6L7 10zM17 9.5a3.5 3.5 0 0 1 0 5", Discounts: "M8 16 16 8M8.5 8.5h.01M15.5 15.5h.01M12 3l2.2 2.2H17v2.8L19.2 10 17 12.2V15h-2.8L12 17.2 9.8 15H7v-2.8L4.8 10 7 7.8V5h2.8z" };
  const SV = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  function store(c) {
    const s = c.store, ser = c.series, o = original(c, "store"), ini = s.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
    const spark = { "Total sales": "sales", "Orders": "orders" };
    const chart = (key, label, extra) => `<div class="sx-chart ${extra || ""}" data-chart="${key}" role="img" aria-label="${esc(label)}, ${esc(ser.months[0])} to ${esc(ser.months[ser.months.length - 1])} ${ser.year}">
      <div class="sx-y"></div><svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><g class="gr"></g><path class="ar"/><path class="ln"/></svg>
      <i class="sx-cross"></i><i class="sx-dot"></i><div class="sx-x"></div><div class="sx-tip" role="status"></div></div>`;
    return `<div class="win sx" data-sd><div class="sx-strip"><span>${esc(s.title)} · rebuilt from the store's ${esc(s.platform || "")} analytics</span>${o ? o.tg : ""}</div>
      <div class="sx-app" data-pane="live">
        <div class="sx-top"><span class="sx-mk" aria-hidden="true">${esc(ini[0])}</span><span class="sx-search">${SV("M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4")}<span>Search</span><kbd>Ctrl K</kbd></span>
          <span class="sx-me"><i>${esc(ini)}</i><span>${esc(s.name)}</span></span></div>
